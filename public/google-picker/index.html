<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkoutTracker Google Picker</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f4;
        --panel: #ffffff;
        --ink: #1a2421;
        --muted: #5d6b66;
        --line: #d6ddd9;
        --accent: #146c5c;
        --danger: #9d2b24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #ffffff 0%, var(--bg) 55%);
        color: var(--ink);
        font:
          16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
      }

      .muted {
        color: var(--muted);
      }

      .error {
        color: var(--danger);
      }
    </style>
    <script>
      (function () {
        "use strict";

        var pickerLoaded = false;
        var pickerShown = false;
        var pickerCfg = null;

        function bridgeMessage(kind, extra) {
          var payload = Object.assign({ kind: kind }, extra || {});
          var channel = window.WorkoutTrackerPicker;
          if (channel && typeof channel.postMessage === "function") {
            channel.postMessage(JSON.stringify(payload));
          }
          return payload;
        }

        function setStatus(title, detail, isError) {
          var titleEl = document.getElementById("title");
          var detailEl = document.getElementById("detail");
          titleEl.textContent = title;
          detailEl.textContent = detail;
          detailEl.className = isError ? "error" : "muted";
        }

        function pickerCallback(data) {
          var action = data[google.picker.Response.ACTION];
          if (action === google.picker.Action.PICKED) {
            var doc = data[google.picker.Response.DOCUMENTS][0] || {};
            bridgeMessage("picked", {
              id: doc[google.picker.Document.ID],
              name: doc[google.picker.Document.NAME],
              url: doc[google.picker.Document.URL],
            });
            setStatus("Spreadsheet selected", "Return to WorkoutTracker.", false);
            return;
          }
          if (action === google.picker.Action.CANCEL) {
            bridgeMessage("cancelled");
            setStatus("Selection cancelled", "Return to WorkoutTracker.", false);
          }
        }

        function openPickerIfReady() {
          if (!pickerLoaded || !pickerCfg || pickerShown) {
            return;
          }
          pickerShown = true;
          setStatus("Opening Google Drive Picker", "Loading your spreadsheets…", false);

          try {
            var view = new google.picker.DocsView().setMimeTypes(
              "application/vnd.google-apps.spreadsheet",
            );

            var picker = new google.picker.PickerBuilder()
              .addView(view)
              .setAppId(pickerCfg.appId)
              .setDeveloperKey(pickerCfg.apiKey)
              .setOAuthToken(pickerCfg.accessToken)
              .setOrigin(window.location.origin)
              .setCallback(pickerCallback)
              .build();

            picker.setVisible(true);
          } catch (error) {
            pickerShown = false;
            bridgeMessage("error", {
              message: "Unable to open the Google Drive picker.",
            });
            setStatus(
              "Picker unavailable",
              String(error && error.message ? error.message : error),
              true,
            );
          }
        }

        window.workoutTrackerPickerInit = function (cfg) {
          pickerCfg = cfg || null;
          openPickerIfReady();
        };

        window.onApiLoad = function () {
          gapi.load("picker", {
            callback: function () {
              pickerLoaded = true;
              bridgeMessage("ready");
              setStatus(
                "Google Drive Picker ready",
                "WorkoutTracker will open the spreadsheet picker now.",
                false,
              );
              openPickerIfReady();
            },
          });
        };

        window.addEventListener("error", function () {
          bridgeMessage("error", {
            message: "The hosted Google Picker page failed to initialize.",
          });
        });
      })();
    </script>
    <script
      async
      defer
      src="https://apis.google.com/js/api.js?onload=onApiLoad"
    ></script>
  </head>
  <body>
    <main>
      <h1 id="title">Preparing Google Drive Picker</h1>
      <p id="detail" class="muted">
        WorkoutTracker will open the spreadsheet picker inside the app.
      </p>
    </main>
  </body>
</html>
